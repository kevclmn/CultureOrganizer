<form id="Card-data">
  <label>Name: <input type="text" name="name" /></label><br />

  <p>Card Type:</p>
  <div id="Radio-questions">
    <div>
      <input
        type="radio"
        id="Type-film-selector"
        name="card-type-selector"
        value="Film"
      />
      <label for="child">Film</label>
    </div>
    <div>
      <input
        type="radio"
        id="Type-Book-selector"
        name="card-type-selector"
        value="Book"
      />
      <label for="child">Book</label>
    </div>
    <div>
      <input
        type="radio"
        id="Type-Theater-selector"
        name="card-type-selector"
        value="Theater"
      />
      <label for="child">Theater</label>
    </div>
    <div>
      <input
        type="radio"
        id="Type-Painting-selector"
        name="card-type-selector"
        value="Painting"
      />
      <label for="child">Painting</label>
    </div>
  </div>
  <label>File: <input type="file" name="file" /></label><br />

  <button type="submit">Send</button>
</form>
