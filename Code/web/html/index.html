<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Culture</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>z
  <body>
    <script src="NewCard.js"></script>
    <div class="container">
      <nav class="nav-bar">
        <div class="icon">
          <img
            class="icon-picture"
            src="Files/Images/Icons/three-dots-line-svgrepo-com.svg"
          />
          <div class="menu">
            <ul>
              <li class="item1">Films</li>
              <li class="item2">Theatre</li>
              <li class="item3">Paintings</li>
            </ul>
          </div>
        </div>
      </nav>

      <header>
        <h1>My Culture</h1>
      </header>

      <div id="bento-grid">
        <button onclick="CreateNewCard()" id="New-card" class="bento-card card">
          <img
            src="Files/Images/Icons/add-square-svgrepo-com.svg"
            class="bento-picture"
          />
          <div class="card-footer"><h1>Add</h1></div>
        </button>
        <div class="bento-card card">
          <img
            src="Files/Images/BentoPictures/PULP_FICTION.jpg"
            class="bento-picture"
          />
          <div class="card-footer"><h1>Pulp Fiction</h1></div>
        </div>
        <div class="bento-card card">
          <img src="Files/Images/BentoPictures/Spiderverse.jpg" />
          <div class="card-footer"><h1>Spiderman into the Spiderverse</h1></div>
        </div>
        <div class="bento-card card">
          <img src="Files/Images/Icons/file-error-svgrepo-com.svg" />
          <div class="card-footer"><h1>Twilight</h1></div>
        </div>
        <div class="bento-card card">
          <img src="Files/Images/BentoPictures/ThaBatman.jpg" />
          <div class="card-footer"><h1>The Batman</h1></div>
        </div>
        <div class="bento-card card">
          <img src="Files/Images/BentoPictures/IsleofDogs.jpg" />
          <div class="card-footer"><h1>Isle of Dogs</h1></div>
        </div>
        <div class="bento-card card">
          <img src="Files/Images/BentoPictures/Lalaland.jpg" />
          <div class="card-footer"><h1>Lalaland</h1></div>
        </div>
        <div class="bento-card card">
          <img src="Files/Images/BentoPictures/Soul.png" />
          <div class="card-footer"><h1>Soul</h1></div>
        </div>
        <div class="bento-card card">
          <img src="Files/Images/BentoPictures/Her.jpg" class="bento-picture" />
          <div class="card-footer"><h1>Her</h1></div>
        </div>
        <div class="bento-card card">
          <img src="Files/Images/BentoPictures/Interstellar.jpg" />
          <div class="card-footer"><h1>Interstellar</h1></div>
        </div>
      </div>

      <footer>
        <p>Kev's Tech &copy; 2023 | Culture organizer</p>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
